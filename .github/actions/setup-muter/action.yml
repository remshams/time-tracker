name: Set up Muter
description: Install Python and Swift, restore or build the pinned Muter binary, and run its regression checks.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - uses: ./.github/actions/setup-swift
      with:
        swift-version: '6.4.1'
    - name: Cache the pinned Muter binary
      id: tools
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .build/swift-tools/muter
          .build/swift-tools/muter-revision.txt
        key: muter-${{ runner.os }}-${{ runner.arch }}-swift-6.4.1-${{ hashFiles('scripts/install-swift-muter.py') }}
    - name: Build the pinned Muter binary
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: python3 scripts/install-swift-muter.py
    - name: Require the real Muter regression checks
      shell: bash
      run: python3 scripts/swift-muter-regressions.py
