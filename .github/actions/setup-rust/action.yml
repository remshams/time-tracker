name: Set up Rust
description: Install the CI toolchain and cache Cargo dependencies and build output.
inputs:
  cache-key:
    description: Separate build caches for tests, coverage, lint, and installed tools. Unused when cache-build is false.
    default: ''
  cache-build:
    description: Restore and save the target directory. Set to false for jobs that never build the workspace.
    default: 'true'
  toolchain:
    description: Rust version used by every CI workflow.
    default: '1.98.1'
  components:
    description: Additional rustup components, such as rustfmt,clippy for jobs that format or lint.
    default: ''
  targets:
    description: Additional Rust compilation targets.
    default: ''
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Select the toolchain for Cargo and Xcode build phases
      shell: bash
      env:
        TRACKER_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
      run: echo "RUSTUP_TOOLCHAIN=$TRACKER_RUST_TOOLCHAIN" >> "$GITHUB_ENV"
    - name: Cache Cargo dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}
    - name: Cache Rust build output
      if: inputs.cache-build == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-key }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
        restore-keys: |
          rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-key }}-
