name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tooltip-control:
    name: Native AppKit tooltip control, ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile and run the AppKit control
        run: |
          mkdir -p .build/tooltip-control
          swiftc -parse-as-library apps/swiftui/Diagnostics/StatusTooltipControl.swift -o .build/tooltip-control/control
          .build/tooltip-control/control .build/tooltip-control | tee .build/tooltip-control/control.log
      - name: Upload native tooltip evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-native-tooltip-control-${{ matrix.runner }}
          path: .build/tooltip-control
          retention-days: 7
