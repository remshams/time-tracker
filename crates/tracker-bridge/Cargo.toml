[package]
name = "tracker-bridge"
description = "C bridge for the native desktop clients"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracker-client = { path = "../tracker-client" }
tracker-application = { path = "../tracker-application" }
tracker-domain = { path = "../tracker-domain" }
tracker-protocol = { path = "../tracker-protocol" }
tracker-remote = { path = "../tracker-remote" }
tracker-storage = { path = "../tracker-storage" }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tracker-server = { path = "../tracker-server" }
tracker-storage = { path = "../tracker-storage", features = ["test-support"] }
