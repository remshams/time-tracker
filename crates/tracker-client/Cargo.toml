[package]
name = "tracker-client"
description = "Shared local and remote client operations"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
thiserror.workspace = true
tracker-application = { path = "../tracker-application" }
tracker-domain = { path = "../tracker-domain" }
tracker-protocol = { path = "../tracker-protocol" }
tracker-remote = { path = "../tracker-remote" }
tracker-storage = { path = "../tracker-storage" }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracker-server = { path = "../tracker-server" }
tracker-storage = { path = "../tracker-storage", features = ["test-support"] }
