[workspace]
resolver = "3"
members = [
    "crates/tracker-domain",
    "crates/tracker-application",
    "crates/tracker-storage",
    "crates/tracker-protocol",
    "crates/tracker-server",
    "crates/tracker-remote",
    "apps/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
crossterm = "0.29.0"
futures-util = "0.3.34"
libc = "0.2.178"
ratatui = "0.30.2"
dirs = "6.0.0"
iana-time-zone = "0.1.65"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
unicode-width = "0.2.2"
uuid = { version = "1.26.0", features = ["v7"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal"] }
tower = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
