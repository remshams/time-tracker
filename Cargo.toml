[workspace]
resolver = "3"
members = ["crates/tracker-core", "apps/tui", "crates/tracker-storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
libc = "0.2.178"
ratatui = "0.30.2"
dirs = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v7"] }
