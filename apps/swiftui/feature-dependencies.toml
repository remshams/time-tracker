# The folders of each Swift target and the folders each one uses. The Swift quality job runs
# scripts/feature-dependencies.py, which fails when the code and this file disagree or the
# folders in a target form a cycle. The targets are checked separately. See ADR 0045.

[targets.TimeTrackerSwiftUI]
# Every folder may use these without listing them.
implicit = ["Shared"]

[targets.TimeTrackerSwiftUI.nodes."App"]
uses = [
    "Features/BulkTaskArchiving",
    "Features/MenuBar",
    "Features/Settings",
    "Features/TaskArchiving",
    "Features/TaskCatalog",
    "Features/TaskCreation",
    "Features/TaskRename",
    "Features/Tracking",
    "Features/WorklogCorrection",
    "Features/WorklogDeletion",
    "Features/WorklogMove",
    "Infrastructure/MacLifecycle",
    "Infrastructure/Preferences",
    "Infrastructure/RustBridge",
    "Infrastructure/System",
]

[targets.TimeTrackerSwiftUI.nodes."Features/BulkTaskArchiving"]
uses = ["Features/ProgressPresentation"]

[targets.TimeTrackerSwiftUI.nodes."Features/Connection"]
uses = ["Features/ProgressPresentation"]

[targets.TimeTrackerSwiftUI.nodes."Features/DailyTotals"]
uses = []

[targets.TimeTrackerSwiftUI.nodes."Features/MenuBar"]
uses = ["Infrastructure/Preferences", "Infrastructure/System"]

[targets.TimeTrackerSwiftUI.nodes."Features/ProgressPresentation"]
uses = []

[targets.TimeTrackerSwiftUI.nodes."Features/Settings"]
