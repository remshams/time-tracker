[package]
name = "tracker-swift-bridge"
description = "Read-only C bridge for the native macOS client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracker-application = { path = "../../../crates/tracker-application" }
tracker-domain = { path = "../../../crates/tracker-domain" }
tracker-storage = { path = "../../../crates/tracker-storage" }

[dev-dependencies]
tempfile = { workspace = true }
