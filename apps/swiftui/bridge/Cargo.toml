[package]
name = "tracker-swift-bridge"
description = "C bridge for the native macOS client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracker-application = { path = "../../../crates/tracker-application" }
tracker-domain = { path = "../../../crates/tracker-domain" }
tracker-protocol = { path = "../../../crates/tracker-protocol" }
tracker-remote = { path = "../../../crates/tracker-remote" }
tracker-storage = { path = "../../../crates/tracker-storage" }

[dev-dependencies]
