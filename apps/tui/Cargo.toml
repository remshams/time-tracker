[package]
name = "tracker-tui"
description = "Terminal front end for the Time Tracker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
crossterm = { workspace = true }
iana-time-zone = { workspace = true }
ratatui = { workspace = true }
tracker-application = { path = "../../crates/tracker-application" }
tracker-domain = { path = "../../crates/tracker-domain" }
tracker-storage = { path = "../../crates/tracker-storage" }
unicode-width = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }
termlens = { version = "0.8.0", default-features = false }
tracker-storage = { path = "../../crates/tracker-storage", features = ["test-support"] }
uuid = { workspace = true }
